<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartEVCharge Admin — Stations</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #09090f;
      --bg2: #10101a;
      --card: #15151f;
      --card2: #1a1a28;
      --accent: #8b31e4;
      --accent2: #6613f4;
      --blue: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --orange: #f59e0b;
      --cyan: #06b6d4;
      --text: #f1f0f7;
      --text2: #9090b0;
      --muted: #5a5a72;
      --border: rgba(168, 85, 247, 0.14);
      --sidebar: 220px;
      --glow: 0 0 24px rgba(168, 85, 247, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
    h1, h2, h3 { font-family: 'Rajdhani', sans-serif; }
    a { text-decoration: none; color: inherit; }

    /* Sidebar */
    .sidebar { width: var(--sidebar); background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; }
    .sidebar-logo { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); }
    .logo-txt { font-size: 19px; color: var(--accent); letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
    .logo-sub { font-size: 9px; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; margin-top: 2px; }
    .sidebar-admin { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .admin-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .admin-name { font-size: 13px; font-weight: 600; }
    .admin-role { font-size: 10px; color: var(--accent); display: flex; align-items: center; gap: 4px; }
    .admin-role::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    .nav { flex: 1; padding: 10px 0; overflow-y: auto; }
    .nav-sec { padding: 8px 18px 4px; font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 18px; color: var(--text2); font-size: 13px; font-weight: 500; transition: .18s; border-left: 3px solid transparent; }
    .nav-item:hover { color: var(--text); background: rgba(168, 85, 247, 0.06); }
    .nav-item.active { color: var(--accent); background: rgba(168, 85, 247, 0.1); border-left-color: var(--accent); }
    .nav-item i { width: 16px; text-align: center; font-size: 13px; }
    .sidebar-bottom { padding: 14px 18px; border-top: 1px solid var(--border); }
    .btn-logout { width: 100%; padding: 9px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 8px; color: var(--red); font-size: 12px; cursor: pointer; transition: .2s; display: flex; align-items: center; justify-content: center; gap: 6px; }

    /* Main Content */
    .main { margin-left: var(--sidebar); min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .topbar-left h3 { font-size: 20px; font-weight: 700; }
    .topbar-left p { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .top-badge { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 8px; padding: 5px 12px; font-size: 11px; color: var(--green); display: flex; align-items: center; gap: 5px; }
    .top-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
    
    .content { padding: 24px 28px; flex: 1; }
    
    /* Layout Alignment Like Bookings */
    .action-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .action-group { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    
    .btn-primary { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: .2s; box-shadow: 0 4px 12px rgba(139, 49, 228, 0.2); white-space: nowrap; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(139, 49, 228, 0.3); }
    .btn-secondary { background: var(--card); border: 1px solid var(--border); padding: 10px 16px; border-radius: 9px; color: var(--text2); font-size: 12px; font-weight: 500; cursor: pointer; transition: .2s; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .btn-secondary:hover { border-color: var(--accent); color: var(--text); }

    .search-container { flex: 1; max-width: 500px; position: relative; }
    .search-container i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px 11px 40px; color: var(--text); font-size: 13px; outline: none; transition: .2s; }
    .filter-sel { background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 10px 14px; color: var(--text); font-size: 13px; outline: none; cursor: pointer; min-width: 140px; }

    /* Table like Bookings */
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow-x: auto; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .tbl th { text-align: left; padding: 14px 18px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); background: var(--card2); }
    .tbl td { padding: 14px 18px; border-bottom: 1px solid rgba(255, 255, 255, .03); vertical-align: middle; white-space: nowrap; }
    .tbl tr:hover td { background: rgba(139, 49, 228, 0.04); }
    
    .st-name-purple { color: var(--accent); font-weight: 600; }
    .metrics-cell { font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 700; color: var(--text); }
    
    .pill { padding: 3px 10px; border-radius: 10px; font-size: 10px; font-weight: 600; text-transform: uppercase; display: inline-block; }
    .pill.online, .pill.active { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .pill.offline, .pill.maintenance { background: rgba(239, 68, 68, 0.15); color: var(--red); }
    .pill.live { background: rgba(6, 182, 212, 0.15); color: var(--cyan); }

    .actions-cell { display: flex; gap: 8px; }
    .act-btn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; transition: .2s; }
    .act-btn.edit { color: var(--blue); background: rgba(59, 130, 246, 0.1); }
    .act-btn.edit:hover { background: var(--blue); color: #fff; }
    .act-btn.delete { color: var(--red); background: rgba(239, 68, 68, 0.1); }
    .act-btn.delete:hover { background: var(--red); color: #fff; }

    /* Modal like Bookings */
    .modal-overlay { position: fixed; inset:0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card2); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 600px; overflow: hidden; }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-body { padding: 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .form-control { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 13px; outline: none; }
    .modal-footer { padding: 20px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; }

    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 20px; display: none; align-items: center; gap: 10px; font-size: 13px; z-index: 1100; box-shadow: var(--glow); }
    .toast.show { display: flex; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-txt"><i class="fas fa-bolt"></i> SmartEV</div>
      <div class="logo-sub">Admin Panel</div>
    </div>
    <div class="sidebar-admin">
      <div class="admin-avatar" id="admin-avatar">A</div>
      <div>
        <div class="admin-name" id="admin-name">Admin User</div>
        <div class="admin-role">Administrator</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-sec">Overview</div>
      <a class="nav-item" href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
      <a class="nav-item" href="bookings.html"><i class="fas fa-calendar-alt"></i> Bookings</a>
      <div class="nav-sec">Management</div>
      <a class="nav-item active" href="stations.html"><i class="fas fa-charging-station"></i> Stations</a>
      <a class="nav-item" href="users.html"><i class="fas fa-users"></i> Users</a>
      <a class="nav-item" href="revenue.html"><i class="fas fa-chart-line"></i> Revenue</a>
      <div class="nav-sec">System</div>
      <a class="nav-item" href="reports.html"><i class="fas fa-file-export"></i> Reports</a>
      <a class="nav-item" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="sidebar-bottom">
      <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h3>Station Management</h3>
        <p>Database stations and live map data</p>
      </div>
      <div class="topbar-right">
        <div class="top-badge">System Online</div>
        <button class="btn-secondary" style="margin-left:14px; padding:10px;" onclick="loadData()"><i class="fas fa-rotate"></i></button>
      </div>
    </div>

    <div class="content">
      <div class="action-bar">
        <div class="action-group">
          <button class="btn-secondary" onclick="setTab('live')"><i class="fas fa-sync"></i> Sync Live Map</button>
          <button class="btn-secondary"><i class="fas fa-file-export"></i> Export CSV</button>
          <button class="btn-primary" onclick="openAdd()"><i class="fas fa-plus"></i> Add Station</button>
        </div>
        <div class="search-container">
          <i class="fas fa-search"></i>
          <input type="text" class="search-input" id="search" placeholder="Search by name, location, operator..." oninput="render()">
        </div>
        <select class="filter-sel" id="status-filter" onchange="render()">
          <option value="">All Stations</option>
          <option value="online">Online</option>
          <option value="maintenance">Maintenance</option>
          <option value="offline">Offline</option>
        </select>
      </div>

      <div class="table-wrap">
        <table class="tbl">
          <thead id="tbl-head"></thead>
          <tbody id="tbl-body">
            <tr><td colspan="10" style="text-align:center;padding:60px;color:var(--muted);"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="fas fa-pen"></i> <span id="modal-title">Edit Station</span></h3>
        <i class="fas fa-times" style="cursor:pointer;color:var(--muted);" onclick="closeModal()"></i>
      </div>
      <div class="modal-body">
        <form class="form-grid" id="st-form">
          <input type="hidden" id="st-id">
          <div class="form-group"><label>Station Name</label><input type="text" id="st-name" class="form-control" required></div>
          <div class="form-group"><label>Full Address</label><input type="text" id="st-address" class="form-control" placeholder="e.g. 123 Main St, Wadala" required></div>
          <div class="form-group"><label>City / Area</label><input type="text" id="st-area" class="form-control" placeholder="Mumbai"></div>
          <div class="form-group"><label>Operator</label><input type="text" id="st-operator" class="form-control" placeholder="e.g. Tata Power"></div>
          <div class="form-group"><label>Status</label>
            <select id="st-status" class="form-control">
              <option value="active">Online</option>
              <option value="maintenance">Maintenance</option>
              <option value="offline">Offline</option>
            </select>
          </div>
          <div class="form-group"><label>Price AC (₹/kWh)</label><input type="number" id="st-ac" class="form-control" value="8"></div>
          <div class="form-group"><label>Price DC (₹/kWh)</label><input type="number" id="st-dc" class="form-control" value="12"></div>
          <div class="form-group"><label>Total Slots</label><input type="number" id="st-slots" class="form-control" value="10"></div>
          <div class="form-group"><label>Latitude</label><input type="number" step="any" id="st-lat" class="form-control" value="19.076"></div>
          <div class="form-group"><label>Longitude</label><input type="number" step="any" id="st-lng" class="form-control" value="72.877"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal()">Close</button>
        <button class="btn-primary" onclick="save()">Save Station</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toast-msg"></span></div>

  <script>
    const adminToken = localStorage.getItem('adminToken');
    const adminUser = JSON.parse(localStorage.getItem('adminUser') || '{}');
    if (!adminToken) window.location.href = 'login.html';

    let dbStations = [];
    let liveStations = [];
    let currentTab = 'db';

    async function loadData() {
      try {
        const res = await fetch('/api/stations');
        const data = await res.json();
        dbStations = data.stations || [];
        render();
      } catch (e) { showToast('Failed to load stations', 'error'); }
    }

    function render() {
      const head = document.getElementById('tbl-head');
      const body = document.getElementById('tbl-body');
      const q = document.getElementById('search').value.toLowerCase();
      const statusF = document.getElementById('status-filter').value;

      if (currentTab === 'db') {
        head.innerHTML = `<tr><th>#</th><th>Station Name</th><th>Location</th><th>Slots</th><th>Free</th><th>AC ₹</th><th>DC ₹</th><th>Operator</th><th>Status</th><th>Actions</th></tr>`;
        const filtered = dbStations.filter(s => {
          const match = s.name.toLowerCase().includes(q) || (s.cityArea||'').toLowerCase().includes(q) || (s.operator||'').toLowerCase().includes(q);
          const sMatch = !statusF || (s.status === 'active' ? 'online' : s.status) === statusF;
          return match && sMatch;
        });
        body.innerHTML = filtered.map((s, i) => `
          <tr>
            <td style="opacity:0.3;">${i+1}</td>
            <td class="st-name-purple">${s.name}</td>
            <td>${s.cityArea || 'Mumbai'}</td>
            <td class="metrics-cell">${s.totalSlots}</td>
            <td class="metrics-cell">${s.availableSlots}</td>
            <td class="metrics-cell" style="color:var(--green);">₹${s.priceAC || 8}</td>
            <td class="metrics-cell" style="color:var(--blue);">₹${s.priceDC || 12}</td>
            <td>${s.operator || 'NexCharge'}</td>
            <td><span class="pill ${s.status === 'active'?'online':s.status}">${s.status === 'active'?'online':(s.status||'online')}</span></td>
            <td>
              <div class="actions-cell">
                <div class="act-btn edit" onclick="openEdit('${s._id}')"><i class="fas fa-pen"></i></div>
                <div class="act-btn delete" onclick="deleteSt('${s._id}')"><i class="fas fa-trash"></i></div>
              </div>
            </td>
          </tr>
        `).join('');
      } else {
        // ... (Live Map logic remains same)
      }
    }

    function openAdd() {
      document.getElementById('st-id').value = '';
      document.getElementById('st-form').reset();
      document.getElementById('modal-title').textContent = 'Add New Station';
      document.getElementById('modal').classList.add('open');
    }
    function openEdit(id) {
      const s = dbStations.find(x => x._id === id);
      if (!s) return;
      document.getElementById('st-id').value = s._id;
      document.getElementById('st-name').value = s.name;
      document.getElementById('st-address').value = s.address || '';
      document.getElementById('st-area').value = s.cityArea || '';
      document.getElementById('st-operator').value = s.operator || '';
      document.getElementById('st-status').value = s.status === 'active' ? 'active' : s.status;
      document.getElementById('st-ac').value = s.priceAC || 8;
      document.getElementById('st-dc').value = s.priceDC || 12;
      document.getElementById('st-slots').value = s.totalSlots;
      document.getElementById('st-lat').value = s.latitude || 19.076;
      document.getElementById('st-lng').value = s.longitude || 72.877;
      document.getElementById('modal-title').textContent = 'Edit Station';
      document.getElementById('modal').classList.add('open');
    }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }

    async function save() {
      const id = document.getElementById('st-id').value;
      const body = {
        name: document.getElementById('st-name').value,
        address: document.getElementById('st-address').value || document.getElementById('st-name').value,
        cityArea: document.getElementById('st-area').value,
        operator: document.getElementById('st-operator').value,
        status: document.getElementById('st-status').value,
        priceAC: Number(document.getElementById('st-ac').value),
        priceDC: Number(document.getElementById('st-dc').value),
        pricePerHour: Number(document.getElementById('st-ac').value), // Required by model
        totalSlots: Number(document.getElementById('st-slots').value),
        latitude: Number(document.getElementById('st-lat').value),
        longitude: Number(document.getElementById('st-lng').value)
      };

      try {
        const res = await fetch(id ? `/api/stations/${id}` : '/api/stations', {
          method: id ? 'PUT' : 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + adminToken
          },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (res.ok) {
          showToast(id ? 'Station updated' : 'Station added');
          closeModal();
          loadData();
        } else {
          showToast(data.message || 'Save failed', 'error');
        }
      } catch (e) { showToast('Server error', 'error'); }
    }

    async function deleteSt(id) {
      if(!confirm('Are you sure you want to delete this station?')) return;
      try {
        const res = await fetch(`/api/stations/${id}`, { 
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + adminToken }
        });
        if (res.ok) {
          showToast('Station deleted');
          loadData();
        } else {
          const data = await res.json();
          showToast(data.message || 'Delete failed', 'error');
        }
      } catch (e) { showToast('Server error', 'error'); }
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      t.style.background = type === 'error' ? 'var(--red)' : 'var(--card2)';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function logout() { localStorage.clear(); window.location.href = '/admin/login'; }

    loadData();
  </script>
</body>
</html>
