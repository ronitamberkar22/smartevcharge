<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartEVCharge — Admin Login</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #09090f;
      --bg2: #10101a;
      --card: #15151f;
      --accent: #a855f7;
      --accent2: #7c3aed;
      --text: #f1f0f7;
      --text2: #9090b0;
      --muted: #5a5a72;
      --border: rgba(168, 85, 247, 0.18);
      --border2: rgba(168, 85, 247, 0.3);
      --glow: 0 0 24px rgba(168, 85, 247, 0.3);
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    h1,
    h2,
    h3 {
      font-family: 'Rajdhani', sans-serif;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 60% 30%, #1a0a2e 0%, #09090f 60%);
      z-index: 0;
    }

    .bg::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 70%, rgba(168, 85, 247, 0.05) 0%, transparent 50%);
    }

    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .lp {
      position: absolute;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: .3;
        transform: scale(1.4)
      }
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(168, 85, 247, .2)
      }

      50% {
        box-shadow: 0 0 50px rgba(168, 85, 247, .5)
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .login-card {
      position: relative;
      z-index: 2;
      width: 440px;
      max-width: 96vw;
      background: rgba(21, 21, 31, 0.92);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border2);
      border-radius: 22px;
      padding: 44px 40px 36px;
      box-shadow: 0 0 80px rgba(168, 85, 247, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: fadeUp .4s ease;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 22px 22px 0 0;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      animation: glow 3s infinite;
    }

    .logo-icon i {
      font-size: 28px;
      color: #fff;
    }

    .login-logo h1 {
      font-size: 26px;
      color: var(--accent);
      letter-spacing: 2px;
    }

    .login-logo p {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(168, 85, 247, 0.1);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 11px;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 10px;
      color: var(--text2);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px 12px 40px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: .2s;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
    }

    .form-control::placeholder {
      color: var(--muted);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 11px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: var(--glow);
    }

    .btn-login:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .error-box {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--red);
      border-radius: 10px;
      padding: 10px 14px;
      margin-top: 10px;
      font-size: 12px;
      align-items: center;
      gap: 8px;
    }

    .error-box.show {
      display: flex;
    }

    .back-link {
      text-align: center;
      margin-top: 18px;
    }

    .back-link a {
      font-size: 12px;
      color: var(--text2);
      text-decoration: none;
      transition: .2s;
    }

    .back-link a:hover {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="particles" id="particles"></div>

  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon"><i class="fas fa-shield-halved"></i></div>
      <h1>ADMIN PORTAL</h1>
      <p>SmartEVCharge Control Centre</p>
    </div>
    <div style="text-align:center;margin-bottom:16px;">
      <span class="role-badge"><i class="fas fa-user-shield"></i> Administrator Access</span>
    </div>

    <div class="form-group">
      <label>Admin Email</label>
      <div class="input-wrap"><i class="fas fa-envelope"></i>
        <input type="email" class="form-control" id="login-email" placeholder="admin@smartevcharge.in"
          autocomplete="email">
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap"><i class="fas fa-lock"></i>
        <input type="password" class="form-control" id="login-pass" placeholder="••••••••"
          autocomplete="current-password">
      </div>
    </div>

    <button class="btn-login" id="login-btn" onclick="doAdminLogin()">
      <i class="fas fa-shield-halved"></i> SIGN IN TO ADMIN
    </button>

    <div class="error-box" id="login-error">
      <i class="fas fa-circle-exclamation"></i>
      <span id="error-text">Invalid credentials</span>
    </div>

    <div class="back-link">
      <a href="../user/login.html"><i class="fas fa-arrow-left"></i> Back to User App</a>
    </div>
  </div>

  <script src="/shared/api.js"></script>
  <script>
    // Particles
    (function () {
      const c = document.getElementById('particles');
      for (let i = 0; i < 16; i++) {
        const p = document.createElement('div'); p.className = 'lp';
        p.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${2 + Math.random() * 3}px;height:${2 + Math.random() * 3}px;animation-delay:${Math.random() * 4}s;animation-duration:${2 + Math.random() * 4}s;opacity:${Math.random() * 0.4 + 0.1};`;
        c.appendChild(p);
      }
    })();

    // Redirect if already admin
    if (localStorage.getItem('adminToken')) {
      const u = JSON.parse(localStorage.getItem('adminUser') || '{}');
      if (u.role === 'admin') window.location.href = '/admin/dashboard';
    }

    async function doAdminLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-pass').value;

      const errEl = document.getElementById('login-error');
      const errTx = document.getElementById('error-text');
      errEl.classList.remove('show');

      if (!email || !password) { errTx.textContent = 'Please enter email and password.'; errEl.classList.add('show'); return; }

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Authenticating…';

      try {
        const data = await apiCall('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (data.user.role !== 'admin') {
          errTx.textContent = 'Access denied. Admin accounts only.';
          errEl.classList.add('show');
          return;
        }

        localStorage.setItem('adminToken', data.token);
        localStorage.setItem('adminUser', JSON.stringify(data.user));
        window.location.href = '/admin/dashboard';
      } catch (err) {
        errTx.textContent = err.message || 'Invalid credentials';
        errEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-shield-halved"></i> SIGN IN TO ADMIN';
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doAdminLogin(); });
  </script>
</body>

</html>
